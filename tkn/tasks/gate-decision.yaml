apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gate-decision
spec:
  description: >-
    Aggregates security gate signals (base-image verification and vulnerability
    scan) into a single pass/fail decision. Downstream tasks depend on this
    task to proceed.
  params:
    - name: BASE_IMAGE_RESULT
      type: string
      description: |
        Result from verify-approved-base-images task.
        Starts with PASSED or FAILED.
    - name: SCAN_OUTPUT
      type: string
      description: |
        JSON vulnerability summary from acs-image-scan task.
        Format: {"vulnerabilities":{"critical":N,"high":N,"medium":N,"low":N}}
  results:
    - name: DECISION
      description: PASSED or FAILED with combined rationale.
  steps:
    - name: decide
      image: registry.access.redhat.com/ubi8-minimal@sha256:b2a1bec3dfbc7a14a1d84d98934dfe8fdde6eb822a211286601cf109cbccb075
      env:
        - name: BASE_IMAGE_RESULT
          value: $(params.BASE_IMAGE_RESULT)
        - name: SCAN_OUTPUT
          value: $(params.SCAN_OUTPUT)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GATE_FAILED=false
        REASONS=""

        echo "=========================================="
        echo "  Security Gate Decision"
        echo "=========================================="
        echo ""

        # --- Check 1: Base image verification ---
        echo "Base image verification: ${BASE_IMAGE_RESULT}"
        if [[ "$BASE_IMAGE_RESULT" != PASSED* ]]; then
          GATE_FAILED=true
          REASONS="Base image verification failed. "
        fi
        echo ""

        # --- Check 2: Vulnerability scan ---
        echo "Vulnerability scan output: ${SCAN_OUTPUT}"

        SKIPPED=$(echo "$SCAN_OUTPUT" | grep -o '"skipped":true' || true)
        if [ -n "$SKIPPED" ]; then
          GATE_FAILED=true
          REASONS="${REASONS}Vulnerability scan was skipped (RHACS not configured). "
          echo "  Scan status: SKIPPED (RHACS not configured)"
        else
          CRITICAL=$(echo "$SCAN_OUTPUT" | grep -o '"critical":[0-9]*' | grep -o '[0-9]*')
          HIGH=$(echo "$SCAN_OUTPUT" | grep -o '"high":[0-9]*' | grep -o '[0-9]*')

          CRITICAL=${CRITICAL:-0}
          HIGH=${HIGH:-0}

          echo "  Critical CVEs: $CRITICAL"
          echo "  High CVEs: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            GATE_FAILED=true
            REASONS="${REASONS}Vulnerability scan found ${CRITICAL} critical CVEs."
          fi
        fi

        if [ "$GATE_FAILED" = "true" ]; then
          echo "=========================================="
          echo "  GATE DECISION: FAILED"
          echo "=========================================="
          echo ""
          echo "Reasons: $REASONS"
          echo ""
          echo "Pipeline will not proceed to deployment."
          printf 'FAILED: %s' "$REASONS" > "$(results.DECISION.path)"
          exit 1
        else
          echo "=========================================="
          echo "  GATE DECISION: PASSED"
          echo "=========================================="
          echo ""
          echo "All security gates passed. Proceeding."
          printf 'PASSED' > "$(results.DECISION.path)"
          exit 0
        fi
