apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ai-demo-app-incoming
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
    - name: pull_request_number
      value: "{{pull_request_number}}"
  pipelineSpec:
    params:
      - name: pull_request_number
        type: string
    workspaces:
      - name: git-auth
    tasks:
      - name: approve-pr
        params:
          - name: pull_request_number
            value: $(params.pull_request_number)
        workspaces:
          - name: git-auth
        taskSpec:
          params:
            - name: pull_request_number
              type: string
          steps:
            - name: approve
              image: curlimages/curl
              script: |
                #!/bin/sh
                set -eu
                PR="$(params.pull_request_number)"
                TOKEN=$(cat /workspace/git-auth/.git-credentials | grep -o 'x-access-token:[^@]*' | cut -d: -f2)
                echo "Approving PR #${PR} on pipelines-as-code/ai-demo-app"
                curl -sf -X POST \
                  -H "Authorization: token ${TOKEN}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/pipelines-as-code/ai-demo-app/pulls/${PR}/reviews" \
                  -d '{"event":"APPROVE","body":"Approved via Slack reaction"}'
                echo "PR #${PR} approved successfully"
          workspaces:
            - name: git-auth
  workspaces:
    - name: git-auth
      secret:
        secretName: "{{ git_auth_secret }}"
