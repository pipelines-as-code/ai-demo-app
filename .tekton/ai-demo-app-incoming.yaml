apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ai-demo-app-incoming
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
    - name: pull_request_number
      value: "{{pull_request_number}}"
  pipelineSpec:
    params:
      - name: pull_request_number
        type: string
    tasks:
      - name: approve-pr
        params:
          - name: pull_request_number
            value: $(params.pull_request_number)
        taskSpec:
          params:
            - name: pull_request_number
              type: string
          steps:
            - name: approve
              image: curlimages/curl
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{ git_auth_secret }}"
                      key: "git-provider-token"
              script: |
                #!/bin/sh
                set -eu
                PR="$(params.pull_request_number)"
                echo "Approving PR #${PR} on pipelines-as-code/ai-demo-app"
                curl -sf -X POST \
                  -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/pipelines-as-code/ai-demo-app/pulls/${PR}/reviews" \
                  -d '{"event":"APPROVE","body":"## ✅ Security Review Approved\n\nThe security team has reviewed and approved this PR via Slack.\n\n🔒 All policy checks have been acknowledged.\n🚀 This PR is cleared for merge.\n\n_Ship it before someone changes their mind!_ 🫡"}'
                echo "PR #${PR} approved successfully"
