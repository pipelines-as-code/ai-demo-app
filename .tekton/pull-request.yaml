---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: demo-app-pr
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunSpecs:
    - pipelineTaskName: build-and-push
      serviceAccountName: buildah-sa
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
    - name: image
      value: "quay.io/chmouel/demo-app:pr-{{pull_request_number}}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: image
    workspaces:
      - name: source
      - name: basic-auth
    tasks:
      - name: fetch-repository
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: clone
              ref:
                resolver: http
                params:
                  - name: url
                    value: https://github.com/openshift-pipelines/tektoncd-catalog/raw/p/stepactions/stepaction-git-clone/0.4.0/stepaction-git-clone.yaml
              params:
                - name: OUTPUT_PATH
                  value: $(workspaces.source.path)
                - name: URL
                  value: "$(params.repo_url)"
                - name: REVISION
                  value: "$(params.revision)"
                - name: BASIC_AUTH_PATH
                  value: $(workspaces.basic-auth.path)
        workspaces:
          - name: source
            workspace: source
          - name: basic-auth
            workspace: basic-auth
      - name: build-and-push
        runAfter:
          - fetch-repository
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: buildah
              image: registry.access.io/rhel8/buildah:latest
              securityContext:
                privileged: true
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euxo pipefail
                buildah bud --isolation chroot --userns=host --layers -t $(params.image) .
                buildah push --authfile /workspace/dockerconfig/.dockerconfigjson \
                  $(params.image) docker://$(params.image)
              volumeMounts:
                - name: podmanconfig
                  mountPath: /workspace/dockerconfig
                  readOnly: true
          volumes:
            - name: dockerconfig
              secret:
                secretName: quay-registry-secret
        workspaces:
          - name: source
            workspace: source

      - name: deploy-test
        runAfter:
          - build-and-push
        taskSpec:
          steps:
            - name: deploy
              image: registry.access.io/openshift4/ose-cli:latest
              script: |
                #!/usr/bin/env bash
                set -euxo pipefail
                oc run demo-app-test-{{pull_request_number}} \
                  --image=$(params.image) \
                  --restart=Never \
                  --labels="app=demo-app-test,pr={{pull_request_number}}" \
                  -n $(context.pipelineRun.namespace)
                trap "oc delete pod demo-app-test-{{pull_request_number}} -n $(context.pipelineRun.namespace) --ignore-not-found" EXIT
                oc wait pod/demo-app-test-{{pull_request_number}} \
                  -n $(context.pipelineRun.namespace) \
                  --for=condition=Ready \
                  --timeout=120s
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
